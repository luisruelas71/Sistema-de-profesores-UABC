<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Registrar Tarea</title>
    <h:outputStylesheet name="css/PaginaNavegacion.css" />
</h:head>
<h:body>
    <div style="padding: 2rem;">

        <p:card styleClass="card-uabc">
            <f:facet name="title">
                <h:outputText value="Registrar nueva tarea" style="color: #1a202c; font-size: 24px; font-weight: bold; display: block; margin-bottom: 10px;"/>
            </f:facet>

            <h:form id="formRegistro">
                <p:messages id="mensajes" showDetail="true" closable="true"/>

                <h:panelGrid columns="1" cellpadding="8" style="width: 100%;">

                    <p:outputLabel for="titulo" value="Título: *" style="font-weight: 600;"/>
                    <p:inputText id="titulo" value="#{tareasController.titulo}" required="true"
                                 style="width: 100%;"/>

                    <p:outputLabel for="descripcion" value="Descripción: *" style="font-weight: 600;"/>
                    <p:inputTextarea id="descripcion" value="#{tareasController.descripcion}" required="true"
                                     rows="4" style="width: 100%;"/>

                    <!-- Selector de Fecha Y HORA -->
                    <p:outputLabel for="fecha" value="Fecha y hora límite: *" style="font-weight: 600;"/>
                    <p:datePicker id="fecha" value="#{tareasController.fechaLimite}" required="true"
                                  showTime="true" pattern="dd/MM/yyyy HH:mm"
                                  style="width: 100%;" showIcon="true"/>

                    <p:outputLabel for="prioridad" value="Prioridad: *" style="font-weight: 600;"/>
                    <p:selectOneMenu id="prioridad" value="#{tareasController.prioridad}" required="true"
                                     style="width: 100%;">
                        <f:selectItem itemLabel="Selecciona una prioridad" itemValue="" />
                        <f:selectItem itemLabel="Media" itemValue="Media" />
                        <f:selectItem itemLabel="Alta" itemValue="Alta" />
                        <f:selectItem itemLabel="Urgente" itemValue="Urgente" />
                    </p:selectOneMenu>

                </h:panelGrid>

                <p:divider style="margin: 20px 0;" />

                <div style="display: flex; gap: 15px;">
                    <p:commandButton value="Guardar tarea" icon="pi pi-save"
                                     action="#{tareasController.guardarTarea}"
                                     update="formRegistro:mensajes @form"
                                     styleClass="btn-uabc" />

                    <p:commandButton value="Volver al menú" icon="pi pi-arrow-left"
                                     action="gestion_tareas?faces-redirect=true"
                                     immediate="true"
                                     styleClass="btn-uabc-outline" />
                </div>
            </h:form>
        </p:card>
    </div>
</h:body>
</html>
