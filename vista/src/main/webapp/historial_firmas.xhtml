<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Historial de Firmas - UABC</title>
    <h:outputStylesheet library="css" name="PaginaNavegacion.css"/>
</h:head>
<h:body>

    <div class="header-portal">
        <div class="logo-container">
            <h:graphicImage library="img" name="escudo_uabc.png" alt="Logo UABC" styleClass="logo-uabc"/>
            <div class="titulo-universidad">
                Universidad Autónoma<br/>de Baja California
            </div>
        </div>
    </div>

    <div class="main-container">
        <!-- Botón para regresar al menú de firmas -->
        <div style="margin-bottom: 1.5rem;">
            <h:outputLink value="firmas.xhtml" styleClass="btn-volver">
                &#8592; Volver al menú de firmas
            </h:outputLink>
        </div>

        <h1 class="titulo-pagina">Historial de Firmas</h1>

        <h:form id="formHistorial">
            <p:growl id="mensajes" showDetail="true" life="3000"/>

            <!-- PANEL DE FILTRADO Y ORDENACIÓN POR FECHAS -->
            <p:panel header="Filtrar y Ordenar por Fechas" style="margin-top: 15px; margin-bottom: 15px;">
                <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                    <div>
                        <p:outputLabel for="fechaInicio" value="Fecha Inicio: " style="font-weight: bold; margin-right: 5px;"/>
                        <p:datePicker id="fechaInicio" value="#{historialFirmasController.fechaInicio}"
                                      pattern="dd/MM/yyyy" showIcon="true" placeholder="dd/mm/aaaa"/>
                    </div>

                    <div>
                        <p:outputLabel for="fechaFin" value="Fecha Fin: " style="font-weight: bold; margin-right: 5px;"/>
                        <p:datePicker id="fechaFin" value="#{historialFirmasController.fechaFin}"
                                      pattern="dd/MM/yyyy" showIcon="true" placeholder="dd/mm/aaaa"/>
                    </div>

                    <div>
                        <p:outputLabel for="ordenFecha" value="Orden: " style="font-weight: bold; margin-right: 5px;"/>
                        <p:selectOneMenu id="ordenFecha" value="#{historialFirmasController.ordenFecha}">
                            <f:selectItem itemLabel="Descendente (Más reciente a antigua)" itemValue="DESC" />
                            <f:selectItem itemLabel="Ascendente (Más antigua a reciente)" itemValue="ASC" />
                        </p:selectOneMenu>
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <p:commandButton value="Filtrar" icon="pi pi-filter"
                                         action="#{historialFirmasController.filtrar}"
                                         update="formHistorial:tablaFirmas formHistorial:mensajes"
                                         styleClass="ui-button-success"/>

                        <p:commandButton value="Limpiar" icon="pi pi-refresh"
                                         action="#{historialFirmasController.limpiarFiltro}"
                                         update="formHistorial:fechaInicio formHistorial:fechaFin formHistorial:ordenFecha formHistorial:tablaFirmas formHistorial:mensajes"
                                         styleClass="ui-button-secondary"/>
                    </div>
                </div>
            </p:panel>

            <!-- Tabla de datos (Data Table) -->
            <p:dataTable id="tablaFirmas" value="#{historialFirmasController.firmas}" var="firma"
                         emptyMessage="No tienes firmas registradas."
                         paginator="true" rows="10" style="margin-top: 20px;">

                <p:column headerText="Fecha">
                    <h:outputText value="#{firma.fecha}" />
                </p:column>

                <p:column headerText="Hora">
                    <h:outputText value="#{firma.hora}" />
                </p:column>

                <p:column headerText="Ubicación">
                    <h:outputText value="#{firma.ubicacion}" />
                </p:column>

                <p:column headerText="Acciones" style="width: 100px; text-align: center;">
                    <!-- Botón de eliminar con confirmación -->
                    <p:commandButton icon="pi pi-trash"
                                     title="Eliminar Firma"
                                     styleClass="ui-button-danger rounded-button"
                                     action="#{historialFirmasController.eliminarFirma(firma.id)}"
                                     update="formHistorial:mensajes formHistorial:tablaFirmas">
                        <p:confirm header="Confirmación"
                                   message="¿Estás seguro de que deseas eliminar esta firma?"
                                   icon="pi pi-exclamation-triangle"/>
                    </p:commandButton>
                </p:column>
            </p:dataTable>

            <!-- Diálogo de Confirmación Global de PrimeFaces -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="Cancelar" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Eliminar" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" />
            </p:confirmDialog>
        </h:form>
    </div>

    <div class="footer-portal">
        <p>Universidad Autónoma de Baja California</p>
    </div>

</h:body>
</html>
