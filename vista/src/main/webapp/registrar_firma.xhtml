<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Confirmación de Firma - UABC</title>
    <h:outputStylesheet library="css" name="PaginaNavegacion.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</h:head>
<h:body>

    <div class="header-portal">
        <div class="logo-container">
            <h:graphicImage library="img" name="escudo_uabc.png" alt="Logo UABC" styleClass="logo-uabc"/>
            <div class="titulo-universidad">
                Universidad Autónoma<br/>de Baja California
            </div>
        </div>
    </div>

    <div class="main-container">

        <div style="margin-bottom: 1.5rem;">
            <h:outputLink value="firmas.xhtml" styleClass="btn-volver">
                &#8592; Volver al menu
            </h:outputLink>
        </div>

        <div class="seccion-subtitulo">Registro Digital</div>
        <h1 class="titulo-pagina">Confirmacion de Firma</h1>
        <p class="descripcion-pagina">precisión de la ubicacion GPS.</p>

        <div class="card-uabc" style="height: auto; overflow: visible;">

            <div style="width: 100%; height: 200px; background-color: var(--fondo-pantalla); border: 2px dashed var(--borde-tarjeta); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--texto-secundario); gap: 0.75rem; margin-bottom: 1.5rem;">
                <i class="fa-solid fa-signature" style="font-size: 3.5rem; color: var(--uabc-verde);"></i>
                <span style="font-size: 1rem; font-weight: 600;">Vista previa de la firma digital</span>
            </div>

            <h:form id="formFirma" style="width: 100%;">
                <h:messages globalOnly="true" style="color: #D32F2F; margin-bottom: 1rem; font-weight: 600;" />

                <h:inputHidden id="inputUbicacion" value="#{firmaController.ubicacion}" />

                <div style="background-color: var(--fondo-pantalla); border-left: 4px solid var(--uabc-verde); padding: 1rem 1.25rem; border-radius: 8px; display: flex; align-items: center; gap: 0.75rem; font-size: 0.95rem; font-weight: 600; color: var(--texto-principal); margin-bottom: 1.5rem;">
                    <i class="fa-solid fa-location-dot" style="color: var(--uabc-verde); font-size: 1.25rem;"></i>
                    <span id="txtUbicacion">Obteniendo coordenadas GPS...</span>
                </div>

                <!-- Botones -->
                <div style="display: flex; justify-content: space-between; gap: 1.5rem;">
                    <p:commandButton value="Rechazar"
                                     action="#{firmaController.rechazarFirma}"
                                     ajax="false"
                                     styleClass="btn-uabc-outline"
                                     style="flex: 1; height: 48px; font-size: 1rem;" />

                    <p:commandButton id="btnGuardar"
                                     value="Aceptar Firma"
                                     action="#{firmaController.guardarFirmaFinal}"
                                     ajax="false"
                                     styleClass="btn-uabc btn-bloqueado"
                                     style="flex: 1; height: 48px; font-size: 1rem;" />
                </div>
            </h:form>
        </div>
    </div>

    <!-- Pie de Página Institucional -->
    <div class="footer-portal">
        <p>Universidad Autónoma de Baja California</p>
        <div class="footer-fecha">
            <div class="footer-linea"></div>
            <span>Gestión Académica</span>
        </div>
    </div>

    <script>
        function capturarCoordenadas() {
            var txtUbicacion = document.getElementById("txtUbicacion");
            var inputHidden = document.getElementById("formFirma:inputUbicacion");

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        var coords = position.coords.latitude + ", " + position.coords.longitude;
                        inputHidden.value = coords;
                        txtUbicacion.textContent = "Ubicación GPS: " + coords;
                        txtUbicacion.style.color = "var(--texto-principal)";

                        var btnElement = document.getElementById("formFirma:btnGuardar");
                        if (btnElement) {
                            btnElement.classList.remove("btn-bloqueado");
                        }
                    },
                    function(error) {
                        txtUbicacion.textContent = "Error GPS: " + error.message;
                        txtUbicacion.style.color = "#D32F2F";
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                txtUbicacion.textContent = "Geolocalización no soportada por el navegador.";
                txtUbicacion.style.color = "#D32F2F";
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            capturarCoordenadas();
        });
    </script>

</h:body>
</html>
