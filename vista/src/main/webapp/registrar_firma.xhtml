<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Confirmación de firma</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .titulo-pantalla {
            color: #333333;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }

        .main-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            flex-grow: 1; /* Permite que el contenedor crezca y llene la pantalla */
        }

        .form-firma {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            flex-grow: 1; /* El formulario ocupa el espacio restante */
        }

        .foto-preview {
            width: 100%;
            height: 350px;
            background-color: #F5F5F5;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #888888;
            font-size: 20px;
        }
        .foto-preview i { font-size: 64px; margin-bottom: 15px; }

        .gps-box {
            width: 100%;
            padding: 30px;
            border: 2px solid #E0E0E0;
            border-radius: 12px;
            text-align: center;
            color: #333333;
            font-size: 20px;
            box-sizing: border-box;
        }

        .botones-container {
            display: flex;
            justify-content: space-between;
            gap: 30px;
            width: 100%;
            margin-top: auto; /* Esto empuja los botones hasta el límite inferior */
        }

        .btn-rechazar, .btn-aceptar {
            flex: 1;
            font-size: 20px !important;
            padding: 20px !important;
            border-radius: 12px !important;
            font-weight: bold !important;
            box-shadow: none !important;
            text-shadow: none !important;
            text-align: center;
        }

        .btn-rechazar {
            background-color: transparent !important;
            color: #D32F2F !important;
            border: 2px solid #D32F2F !important;
        }
        .btn-rechazar:hover { background-color: #FFF0F0 !important; }

        .btn-aceptar {
            background-color: #006B3F !important;
            color: white !important;
            border: none !important;
        }
        .btn-aceptar:hover { background-color: #00502F !important; }

        .btn-bloqueado { opacity: 0.5; pointer-events: none; cursor: not-allowed; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</h:head>
<h:body>

    <div class="titulo-pantalla">Confirmación de firma</div>

    <div class="main-container">

        <div class="foto-preview">
            <i class="fa-regular fa-image"></i>
            <span>Captured Photo</span>
        </div>

        <h:form id="formFirma" styleClass="form-firma">
            <h:messages globalOnly="true" style="color: red;" />

            <h:inputHidden id="inputUbicacion" value="#{firmaController.ubicacion}" />

            <div class="gps-box">
                <span id="txtUbicacion" style="color: gray;">Obteniendo coordenadas...</span>
            </div>

            <div class="botones-container">
                <p:commandButton value="Rechazar"
                                 action="#{firmaController.rechazarFirma}"
                                 ajax="false"
                                 styleClass="btn-rechazar" />

                <p:commandButton id="btnGuardar"
                                 value="Aceptar Firma"
                                 action="#{firmaController.guardarFirmaFinal}"
                                 ajax="false"
                                 styleClass="btn-aceptar btn-bloqueado" />
            </div>
        </h:form>
    </div>

    <script>
        function capturarCoordenadas() {
            var txtUbicacion = document.getElementById("txtUbicacion");
            var inputHidden = document.getElementById("formFirma:inputUbicacion");

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        var coords = position.coords.latitude + ", " + position.coords.longitude;
                        inputHidden.value = coords;
                        txtUbicacion.textContent = "Ubicación GPS: " + coords;
                        txtUbicacion.style.color = "#333333";

                        var btnElement = document.getElementById("formFirma:btnGuardar");
                        if (btnElement) {
                            btnElement.classList.remove("btn-bloqueado");
                        }
                    },
                    function(error) {
                        txtUbicacion.textContent = "Error GPS: " + error.message;
                        txtUbicacion.style.color = "red";
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                txtUbicacion.textContent = "Geolocalización no soportada por el navegador.";
                txtUbicacion.style.color = "red";
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            capturarCoordenadas();
        });
    </script>

</h:body>
</html>
